services:
  web:
  
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env.compose
    ports:
      - "8000:8000"
    command: >
      gunicorn config.wsgi:application
      --bind 127.0.0.1:8000
      --workers 3
      --timeout 120
    volumes:
      - ./src:/code
